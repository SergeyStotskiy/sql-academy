<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL — интерактивный учебник</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SQL — интерактивный учебник</h1>
      <p class="subtitle">SQLite прямо в браузере · пишите запросы, смотрите результат, проверяйте себя</p>
    </div>
    <div id="db-toolbar" class="db-toolbar hidden">
      <button id="open-db-btn" class="btn">🗄️ Посмотреть БД</button>
      <button id="reset-db-btn" class="btn btn-secondary" title="Вернуть базу в исходное состояние">
        ↺ Сбросить базу
      </button>
    </div>
  </header>

  <div id="db-modal" class="db-modal hidden">
    <div class="db-modal-window">
      <header class="db-modal-header">
        <h2>🗄️ База данных</h2>
        <button class="btn btn-secondary db-modal-close" title="Закрыть (Esc)">✕ Закрыть</button>
      </header>
      <div class="db-modal-body"></div>
    </div>
  </div>

  <p id="boot-status" class="boot-status">Загружаю SQLite (sql.js) и учебную базу…</p>

  <div id="app" class="app hidden">
    <nav class="sidebar">
      <ul id="lesson-nav"></ul>
    </nav>

    <main id="main-content" class="main"></main>

    <aside class="schema-panel">
      <h3>Схема БД</h3>
      <div id="schema-reference"></div>
    </aside>
  </div>

  <script src="lessons.js"></script>
  <script src="tasks.js"></script>
  <script src="app.js"></script>
</body>
</html>
